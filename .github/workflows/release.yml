name: Build And Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/desktop/frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Windows app
        working-directory: backend/desktop
        shell: bash
        run: |
          wails build -clean -nopackage -platform windows/amd64 -o EncryptKeep -webview2 download -tags "webkit2_41"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EncryptKeep-windows-amd64-exe
          path: |
            backend/desktop/build/bin/EncryptKeep
            backend/desktop/build/bin/EncryptKeep.exe
          if-no-files-found: error

      - name: Upload installer artifacts (if present)
        uses: actions/upload-artifact@v4
        with:
          name: EncryptKeep-windows-installers
          path: backend/desktop/build/bin/*installer*.exe
          if-no-files-found: ignore

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/desktop/build/bin/EncryptKeep
            backend/desktop/build/bin/EncryptKeep.exe
            backend/desktop/build/bin/*installer*.exe
