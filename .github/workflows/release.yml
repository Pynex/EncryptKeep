name: Build And Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            target: windows-amd64
            tags: ""
          - os: ubuntu-latest
            platform: linux/amd64
            target: linux-amd64
            tags: "webkit2_41"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/desktop/frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Build app
        working-directory: backend/desktop
        shell: bash
        run: |
          if [[ "${{ matrix.tags }}" == "" ]]; then
            wails build -clean -nopackage -platform "${{ matrix.platform }}" -o EncryptKeep -webview2 download
          else
            wails build -clean -nopackage -platform "${{ matrix.platform }}" -o EncryptKeep -webview2 download -tags "${{ matrix.tags }}"
          fi

      - name: Normalize release filenames
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="backend/desktop/build/bin"
          RELEASE_DIR="release"
          mkdir -p "$RELEASE_DIR"

          if [[ "${{ matrix.target }}" == "windows-amd64" ]]; then
            if [[ -f "$BIN_DIR/EncryptKeep.exe" ]]; then
              cp "$BIN_DIR/EncryptKeep.exe" "$RELEASE_DIR/EncryptKeep-windows-amd64.exe"
            elif [[ -f "$BIN_DIR/EncryptKeep" ]]; then
              cp "$BIN_DIR/EncryptKeep" "$RELEASE_DIR/EncryptKeep-windows-amd64.exe"
            else
              echo "Windows binary not found in $BIN_DIR"
              ls -la "$BIN_DIR"
              exit 1
            fi
          else
            if [[ -f "$BIN_DIR/EncryptKeep" ]]; then
              cp "$BIN_DIR/EncryptKeep" "$RELEASE_DIR/EncryptKeep-linux-amd64"
            elif [[ -f "$BIN_DIR/EncryptKeep.exe" ]]; then
              cp "$BIN_DIR/EncryptKeep.exe" "$RELEASE_DIR/EncryptKeep-linux-amd64"
            else
              echo "Linux binary not found in $BIN_DIR"
              ls -la "$BIN_DIR"
              exit 1
            fi
            chmod +x "$RELEASE_DIR/EncryptKeep-linux-amd64"
            tar -C "$RELEASE_DIR" -czf "$RELEASE_DIR/EncryptKeep-linux-amd64.tar.gz" EncryptKeep-linux-amd64
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release Assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
